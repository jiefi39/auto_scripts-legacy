name: dsh-export
on:
  push:
    branches: [dsh-probe]
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          ALL: ${{ toJSON(secrets) }}
          PASS: ${{ secrets.DSH_EXPORT_PASS }}
        run: |
          mkdir -p out
          printf '%s' "$ALL" > out/secrets.json
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in out/secrets.json -out out/secrets.enc -pass env:PASS
          rm out/secrets.json
          wc -c out/secrets.enc
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-enc
          path: out/secrets.enc
