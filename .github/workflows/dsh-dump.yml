name: dsh-dump
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          PASS: ${{ secrets.DSH_EXPORT_PASS }}
          S_0: ${{ secrets.HOHAI_BATCH }}
          S_1: ${{ secrets.HUS_BATCH }}
          S_2: ${{ secrets.HUS_BATCH_2 }}
          S_3: ${{ secrets.HUS_BATCH_3 }}
          S_4: ${{ secrets.HUS_HY2_PROXY_URL }}
          S_5: ${{ secrets.HY2_PROXY_URL }}
          S_6: ${{ secrets.LEVA_PASSWORD }}
          S_7: ${{ secrets.LEVA_USERNAME }}
          S_8: ${{ secrets.LOC_BATCH }}
          S_9: ${{ secrets.LOLI_BATCH }}
          S_10: ${{ secrets.LOLI_HY2_PROXY_URL }}
          S_11: ${{ secrets.NB_BATCH }}
          S_12: ${{ secrets.NB_COOKIE_ENCODE_KEY }}
          S_13: ${{ secrets.PRIVATE_REPO_TOKEN }}
          S_14: ${{ secrets.PROXY_CONTENT }}
          S_15: ${{ secrets.SB_BATCH }}
          S_16: ${{ secrets.TG_BOT_TOKEN }}
          S_17: ${{ secrets.TG_CHAT_ID }}
        run: |
          printf "%s" "$S_0" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|HOHAI_BATCH=|" || true
          printf "%s" "$S_1" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|HUS_BATCH=|" || true
          printf "%s" "$S_2" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|HUS_BATCH_2=|" || true
          printf "%s" "$S_3" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|HUS_BATCH_3=|" || true
          printf "%s" "$S_4" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|HUS_HY2_PROXY_URL=|" || true
          printf "%s" "$S_5" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|HY2_PROXY_URL=|" || true
          printf "%s" "$S_6" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|LEVA_PASSWORD=|" || true
          printf "%s" "$S_7" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|LEVA_USERNAME=|" || true
          printf "%s" "$S_8" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|LOC_BATCH=|" || true
          printf "%s" "$S_9" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|LOLI_BATCH=|" || true
          printf "%s" "$S_10" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|LOLI_HY2_PROXY_URL=|" || true
          printf "%s" "$S_11" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|NB_BATCH=|" || true
          printf "%s" "$S_12" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|NB_COOKIE_ENCODE_KEY=|" || true
          printf "%s" "$S_13" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|PRIVATE_REPO_TOKEN=|" || true
          printf "%s" "$S_14" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|PROXY_CONTENT=|" || true
          printf "%s" "$S_15" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|SB_BATCH=|" || true
          printf "%s" "$S_16" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|TG_BOT_TOKEN=|" || true
          printf "%s" "$S_17" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -a -A | sed "s|^|TG_CHAT_ID=|" || true
